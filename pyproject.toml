[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sitejs"
version = "1.0.0"
description = "SiteJS.py – the Python Small Web builder"
readme = "README.md"
authors = [{name = "Purrple-hub", email = ""}]
license = {text = "Boost Software License 1.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Boost Software License 1.0",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Text Processing :: Markup :: HTML",
]
requires-python = ">=3.9"
dependencies = [
    "markdown>=3.5",
    "jinja2>=3.1",
    "watchdog>=3.0",
]
dynamic = ["version"]

[project.optional-dependencies]
full = [
    "cryptography>=41.0",
    "Pillow>=10.0",
    "cssmin>=0.2",
    "jsmin>=3.0",
    "boto3>=1.34",
    "paramiko>=3.4",
    "toml>=0.10",
    "websockets>=12.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "pytest-xdist>=3.0",
    "pytest-httpserver>=1.0",
    "requests>=2.28",
    "build>=1.0",
    "twine>=4.0",
]

[project.scripts]
sitejs = "sitejs:main"

[project.urls]
Homepage = "https://github.com/Purrple-hub/SiteJS.py"
Repository = "https://github.com/Purrple-hub/SiteJS.py"
Issues = "https://github.com/Purrple-hub/SiteJS.py/issues"

[tool.setuptools]
py-modules = ["sitejs"]

[tool.setuptools.package-data]
sitejs = ["templates/*", "static/*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=sitejs --cov-report=term --cov-report=html --cov-fail-under=80"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["sitejs"]
omit = ["tests/*", "TestSiteJS.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]
target-version = "py39"
